name: Museum 3D checks
concurrency:
  group: museum-3d-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  push:
    paths:
      - 'empty-museum/**'
      - '.github/workflows/museum-3d-checks.yml'
  pull_request:
    paths:
      - 'empty-museum/**'
permissions:
  contents: read
jobs:
  validation:
    name: Node inventory and module checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run museum smoke tests
        run: node --test empty-museum/tests/museum.test.mjs
      - name: Validate physical gallery layout and indirect-occlusion profiles
        run: node --test empty-museum/tests/gallery-layout-v3.test.mjs

  browser-preview:
    name: Architectural staging render (desktop and mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps
      - name: Render museum from local staging build
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/museum-staging.log 2>&1 &
          sleep 2
          node .github/scripts/tem-v3-preview.mjs
          TEM_BASE_URL=http://127.0.0.1:8765/empty-museum/ node .github/scripts/tem-e2e.mjs
      - name: Publish preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: museum-v3-staging-screenshots
          path: /tmp/museum-v3-*.png
          if-no-files-found: ignore
          retention-days: 7
