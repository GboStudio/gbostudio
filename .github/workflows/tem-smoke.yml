name: The Unreal Museum - site health

# Public check runs on main updates, but never tests the old live site:
# first wait until GitHub Pages has completed this exact revision.
# Run a periodic independent check even without source changes.
concurrency:
  group: unreal-museum-public-${{ github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'empty-museum/**'
      - '.github/workflows/tem-smoke.yml'
      - '.github/scripts/tem-e2e.mjs'
      - '.github/scripts/tem-tour-test.mjs'
      - '.github/scripts/wait-pages-deployment.py'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read
  actions: read

jobs:
  smoke:
    name: Museum - public pages and visitor journey
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check museum security invariants (daily and after changes)
        run: node --test empty-museum/tests/security-hardening.test.mjs

      - name: Wait for GitHub Pages deployment of this exact revision
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/wait-pages-deployment.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --timeout 300

      - name: Test guided route logic
        run: node .github/scripts/tem-tour-test.mjs

      - name: Test public HTTP availability
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://gbostudio.fr/empty-museum/"
            "https://gbostudio.fr/empty-museum/3d.html"
            "https://gbostudio.fr/empty-museum/engine-loader.js"
            "https://gbostudio.fr/empty-museum/engine3d.js"
            "https://gbostudio.fr/empty-museum/museum-v5.js"
            "https://gbostudio.fr/empty-museum/museum-mobile-v12.css"
            "https://gbostudio.fr/empty-museum/scenography.js"
            "https://gbostudio.fr/empty-museum/luxury-v8.js"
          )
          for url in "${urls[@]}"; do
            echo "::group::Checking ${url}"
            ok=0
            for attempt in {1..8}; do
              code=$(curl -L -sS --connect-timeout 10 --max-time 25                 -w '%{http_code}' -o /tmp/tem-response "${url}" || true)
              bytes=$(wc -c </tmp/tem-response 2>/dev/null || echo 0)
              echo "Attempt ${attempt}/8 HTTP ${code} bytes ${bytes}"
              if [[ "${code}" == "200" && "${bytes}" -gt 100 ]]; then ok=1; break; fi
              sleep 10
            done
            if [[ "${ok}" -ne 1 ]]; then
              echo "::error::Museum deployment unavailable: ${url} returned HTTP ${code}, bytes ${bytes}"
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "Public museum routes and essential assets are reachable."

      - name: Install browser test tooling
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium --with-deps

      - name: Test visitor journeys on desktop and mobile
        run: node .github/scripts/tem-e2e.mjs

      - name: Upload failed browser screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: museum-browser-diagnostics
          path: /tmp/tem-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
