<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE UNREAL MUSEUM — Entrer dans le musée</title>
<meta name="description" content="Explorez librement The Unreal Museum, le musée immersif des créations.">
<meta http-equiv="refresh" content="0; url=./?visit=immersive">
<link rel="canonical" href="https://gbostudio.fr/empty-museum/?visit=immersive">
<style>
html,body{margin:0;min-height:100%;background:#eeeae2;color:#272a27;font:16px/1.6 Arial,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
section{max-width:460px;text-align:center}
a{display:inline-block;margin:14px auto;background:#292f29;color:#fff;text-decoration:none;padding:12px 20px;font-size:14px;font-weight:700}
</style>
<script>
(function(){
  var target=new URL("./",location.href);
  target.searchParams.set("visit","immersive");
  var current=new URLSearchParams(location.search);
  current.forEach(function(value,key){if(key!=="visit")target.searchParams.set(key,value)});
  target.hash=location.hash;
  location.replace(target.href);
})();
</script>
</head>
<body>
<main><section>
<h1>THE UNREAL MUSEUM</h1>
<p>La visite immersive s'ouvre dans le musée unique.</p>
<a href="./?visit=immersive">ENTRER DANS LE MUSÉE ↗</a>
</section></main>
</body>
</html>
